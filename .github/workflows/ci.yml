name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SITE_URL: https://bilans-i-spolka.example
  # Testowe klucze Cloudflare (zawsze przechodzą): widget generuje token, serwer go weryfikuje.
  NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
  TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

jobs:
  quality:
    name: Lint, typy, testy jednostkowe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Sanity Studio - typy i walidacja schematu
        env:
          SANITY_STUDIO_PROJECT_ID: ci00demo
        run: |
          pnpm --dir studio install --ignore-workspace --frozen-lockfile
          pnpm --dir studio typecheck
          pnpm --dir studio validate

  e2e:
    name: Build, e2e i dostępność
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Budżet JS strony głównej
        run: node scripts/check-bundle.mjs
      - name: Lighthouse CI (blokuje PR poniżej progu)
        env:
          LEAD_STORE: memory
        run: pnpm dlx @lhci/cli@0.15.1 autorun
